[project]
name = "wikiwaves"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali Tavallaie", email = "a.tavallaie@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "huggingface-hub>=0.20",
    "loguru>=0.7.3",
    "numpy>=1.26.4",
    "onnxruntime>=1.23",
    "opencv-python>=4.11.0.86",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "soundfile>=0.13.1",
    "supertonic>=1.2.0",
    "visgen>=0.2.2",
]

[project.scripts]
wikiwaves = "wikiwaves:main"

[project.optional-dependencies]
pockettts = ["pocket-tts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "responses>=0.25",
]
